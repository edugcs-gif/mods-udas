name: cassino - gerar o .jar

on:
  push:
    paths:
      - 'cassino/**'
      - '.github/workflows/cassino.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cassino
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: cassino
      - name: Compilar
        run: chmod +x gradlew && ./gradlew build --no-daemon
      # O Minecraft 1.20.1 roda no Java 17: nada no .jar (nem as bibliotecas embutidas) pode exigir Java mais novo.
      - name: Conferir Java 17
        run: |
          python3 - <<'PY'
          import glob, struct, sys, zipfile
          bad = []
          for jar in glob.glob('build/libs/*.jar'):
              with zipfile.ZipFile(jar) as z:
                  for name in z.namelist():
                      if name.endswith('.class') and not name.startswith('META-INF/versions/'):
                          major = struct.unpack('>H', z.read(name)[6:8])[0]
                          if major > 61:
                              bad.append(f'{jar}: {name} (Java {major - 44})')
          print('\n'.join(bad[:20]) or 'Tudo compatível com Java 17.')
          sys.exit(1 if bad else 0)
          PY
      # Conferência temporária: recorta os rostos da loteria das texturas do Minecraft (para checar os recortes).
      - name: Rostos da loteria
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import glob, io, zipfile
          from PIL import Image
          jars = [j for j in glob.glob('/home/runner/.gradle/caches/**/*.jar', recursive=True)
                  if 'minecraft' in j.lower() and ('client' in j.lower() or 'merged' in j.lower())]
          jar = None
          for j in jars:
              try:
                  with zipfile.ZipFile(j) as z:
                      if 'assets/minecraft/textures/entity/pig/pig.png' in z.namelist():
                          jar = j
                          break
              except Exception:
                  pass
          print('JAR', jar)
          z = zipfile.ZipFile(jar)
          def tex(path):
              return Image.open(io.BytesIO(z.read('assets/minecraft/textures/entity/' + path + '.png'))).convert('RGBA')
          F = []
          def face(w, h, *layers):
              F.append((w, h, layers))
          def biped(t):
              face(8, 8, (t, 8, 8, 8, 8, 0, 0), (t, 40, 8, 8, 8, 0, 0))
          def vill(t):
              face(8, 11, (t, 8, 8, 8, 10, 0, 0), (t, 26, 2, 2, 4, 3, 7))
          face(8, 8, ('pig/pig', 8, 8, 8, 8, 0, 0), ('pig/pig', 17, 17, 4, 3, 2, 4))
          face(8, 8, ('cow/cow', 6, 6, 8, 8, 0, 0))
          face(6, 6, ('sheep/sheep', 8, 8, 6, 6, 0, 0), ('sheep/sheep_fur', 6, 6, 6, 6, 0, 0))
          face(4, 6, ('chicken', 3, 3, 4, 6, 0, 0), ('chicken', 16, 2, 4, 2, 0, 2), ('chicken', 16, 6, 2, 2, 1, 4))
          face(6, 8, ('wolf/wolf', 17, 15, 2, 2, 0, 0), ('wolf/wolf', 17, 15, 2, 2, 4, 0), ('wolf/wolf', 4, 4, 6, 6, 0, 2), ('wolf/wolf', 4, 14, 3, 3, 1, 5))
          face(8, 8, ('fox/fox', 9, 2, 2, 2, 0, 0), ('fox/fox', 16, 2, 2, 2, 6, 0), ('fox/fox', 7, 11, 8, 6, 0, 2), ('fox/fox', 9, 21, 4, 2, 2, 6))
          face(7, 7, ('bee/bee', 10, 10, 7, 7, 0, 0))
          face(12, 16, ('squid/squid', 12, 12, 12, 16, 0, 0))
          vill('villager/villager')
          vill('iron_golem/iron_golem')
          biped('zombie/zombie')
          biped('zombie/drowned')
          biped('skeleton/skeleton')
          face(8, 8, ('creeper/creeper', 8, 8, 8, 8, 0, 0))
          face(8, 8, ('spider/spider', 40, 12, 8, 8, 0, 0), ('spider_eyes', 40, 12, 8, 8, 0, 0))
          face(8, 8, ('slime/slime', 6, 22, 6, 6, 1, 1), ('slime/slime', 34, 2, 2, 2, 1, 2), ('slime/slime', 34, 6, 2, 2, 5, 2), ('slime/slime', 33, 9, 1, 1, 4, 5), ('slime/slime', 8, 8, 8, 8, 0, 0))
          vill('illager/pillager')
          face(8, 8, ('enderman/enderman', 8, 8, 8, 8, 0, 0), ('enderman/enderman_eyes', 8, 8, 8, 8, 0, 0))
          face(8, 8, ('blaze', 8, 8, 8, 8, 0, 0))
          face(16, 16, ('ghast/ghast', 16, 16, 16, 16, 0, 0))
          face(10, 8, ('piglin/piglin', 8, 8, 10, 8, 0, 0), ('piglin/piglin', 32, 2, 4, 4, 3, 4), ('piglin/piglin', 3, 5, 1, 2, 7, 6), ('piglin/piglin', 3, 1, 1, 2, 2, 6))
          biped('skeleton/wither_skeleton')
          face(16, 16, ('warden/warden', 10, 42, 16, 16, 0, 0))
          face(8, 8, ('wither/wither', 8, 8, 8, 8, 0, 0))
          for i, (w, h, layers) in enumerate(F):
              canvas = Image.new('RGBA', (w, h))
              sizes = []
              for t, u, v, lw, lh, x, y in layers:
                  im = tex(t)
                  sizes.append(f'{t}={im.size[0]}x{im.size[1]}')
                  part = im.crop((u, v, u + lw, v + lh))
                  canvas.alpha_composite(part, (x, y))
              print('FACE', i, w, h, ' '.join(sizes))
              px = canvas.load()
              for yy in range(h):
                  print('ROW', i, ' '.join('%02x%02x%02x%02x' % px[xx, yy] for xx in range(w)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cassino
          path: cassino/build/libs/*.jar
